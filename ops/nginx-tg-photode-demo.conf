server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name tg-photode.195-19-144-52.sslip.io;

    root /var/www/tg-photode-demo;
    index main.html;

    ssl_certificate /etc/letsencrypt/live/tg-photode.195-19-144-52.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tg-photode.195-19-144-52.sslip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    client_max_body_size 100m;

    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; connect-src 'self' wss://tg-photode.195-19-144-52.sslip.io; form-action 'none'; frame-ancestors 'none'; img-src 'self' blob: data:; media-src 'self' blob:; script-src 'self'; style-src 'self'" always;

    location = / {
        try_files /main.html =404;
    }

    location /static/ {
        try_files $uri =404;
    }

    location /api/ {
        access_log off;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        return 404;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name tg-photode.195-19-144-52.sslip.io;
    return 301 https://$host$request_uri;
}
